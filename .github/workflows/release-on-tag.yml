name: Release Artifacts on Tag

on:
  workflow_call:
    inputs:
      tag_name:
        description: The version tag created by release-please.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: Published release tag to rebuild and attach artifacts for.
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write # Needed to upload assets to the existing GitHub Release.

jobs:
  build-and-attach:
    name: Build and attach release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: npm run build

      - name: Verify release versions
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
          RELEASE_CHECK_MONOTONIC: ${{ github.event_name != 'workflow_dispatch' }}
        run: npm run verify:release

      - name: Generate CRX package
        id: crx
        env:
          CHROME_EXTENSION_PRIVATE_KEY: ${{ secrets.CHROME_EXTENSION_PRIVATE_KEY }}
          RELEASE_VERSION: ${{ inputs.tag_name || github.ref_name }}
          REQUIRE_CRX: 'true'
        run: node scripts/create-crx.js

      - name: Package build output
        id: package
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          ARCHIVE_DIR="release-artifacts"
          ARCHIVE_NAME="app-${RELEASE_TAG}.tar.gz"
          mkdir -p "$ARCHIVE_DIR"

          test -s dist/manifest.json
          tar --exclude='*.map' -czf "$ARCHIVE_DIR/$ARCHIVE_NAME" dist
          test -s "$ARCHIVE_DIR/$ARCHIVE_NAME"
          echo "archive=$ARCHIVE_DIR/$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"

      - name: Verify release assets
        env:
          ARCHIVE_PATH: ${{ steps.package.outputs.archive }}
          CRX_PATH: ${{ steps.crx.outputs.crx_path }}
        run: |
          test -s "$ARCHIVE_PATH"
          test -s "$CRX_PATH"

      - name: Attach archive and CRX to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.crx.outputs.crx_path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
